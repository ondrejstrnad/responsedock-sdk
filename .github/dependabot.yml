version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Minor and patch updates are grouped; each major update gets its own PR and review.
    groups:
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    # Workflows and the local composite action.
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
